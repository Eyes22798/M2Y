name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every push to main stays fully verified; superseded pull request runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # expo-router writes typed routes into the gitignored .expo/types. On a fresh
      # checkout that file is absent, Href degrades to a loose string type and
      # typecheck stops validating routes. Generate it before tsc, not after.
      - run: pnpm exec expo customize tsconfig.json
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm test --ci
      - run: pnpm test:migrations --ci
      - run: pnpm config:check
      - run: pnpm exec expo-doctor
      - run: pnpm exec expo export --platform android
      - run: pnpm exec expo prebuild --clean --no-install --platform android
        env:
          APP_VARIANT: development

      - run: pnpm server:format:check
      - run: pnpm server:typecheck
      - run: pnpm server:lint
      - run: pnpm --filter @m2y/server test --ci
      - run: pnpm --filter @m2y/server test:migrations --ci
      - run: pnpm server:build

  # modules/m2y-crypto carries every cryptographic primitive and had no compile or test gate at
  # all, which the tech-selection doc lists as the project's only "极高" risk. This job runs the
  # module's JVM unit tests (no device, no emulator). It is deliberately a separate job so a
  # toolchain failure here cannot mask the mobile/server gate results above.
  native-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # libsignal 0.101.0 ships Java 21 bytecode, so Gradle itself must run on JDK 21, while the
      # React Native included build still needs a JDK 17 toolchain. Both must be installed; the
      # second setup-java call is the one that wins JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('modules/m2y-crypto/android/build.gradle', 'pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # android/ is a regenerable CNG artifact and is not tracked, so the Gradle project that
      # autolinks m2y-crypto has to be generated before any Gradle task can run.
      - run: pnpm exec expo prebuild --clean --no-install --platform android
        env:
          APP_VARIANT: development
      - run: pnpm test:native:crypto
        env:
          M2Y_JAVA_17_HOME: ${{ env.JAVA_HOME_17_X64 }}
