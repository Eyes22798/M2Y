name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps:check
      - run: pnpm test --ci
      - run: pnpm config:check
      - run: pnpm exec expo-doctor
      - run: pnpm exec expo export --platform android
      - run: pnpm exec expo prebuild --clean --no-install --platform android
        env:
          APP_VARIANT: development

      - run: pnpm server:format:check
      - run: pnpm server:typecheck
      - run: pnpm server:lint
      - run: pnpm server:test -- --ci
      - run: pnpm server:build

      # Database migration tests become required when Spike C creates the first schema.
